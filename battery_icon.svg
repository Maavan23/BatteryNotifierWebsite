<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#311042" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <linearGradient id="batteryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect x="5" y="5" width="190" height="190" rx="44" fill="url(#bgGrad)" stroke="#6366f1" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Battery outer body -->
  <rect x="42" y="65" width="105" height="70" rx="12" fill="none" stroke="#a855f7" stroke-width="5" filter="url(#glow)"/>
  
  <!-- Battery terminal / cap -->
  <path d="M 152 83 Q 156 83 156 87 L 156 113 Q 156 117 152 117 Z" fill="#a855f7"/>

  <!-- Battery fill level (e.g. 80%) -->
  <rect x="48" y="71" width="78" height="58" rx="8" fill="url(#batteryGrad)"/>

  <!-- Charging bolt overlay -->
  <path d="M 102 52 L 80 98 L 96 98 L 88 148 L 122 92 L 102 92 Z" fill="url(#boltGrad)" filter="url(#glow)"/>
  
  <!-- Status dot -->
  <circle cx="152" cy="52" r="8" fill="#10b981" filter="url(#glow)"/>
</svg>
